[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sand-simulator"
version = "0.1.0"
description = "Simulating falling sand with pygame"
authors = [{name = "Olivier Deloubriere"}]
dependencies = [
    "pygame>=2.0.0",
]

[project.scripts]
sand = "sand_simulator.main:main"

[tool.setuptools.packages.find]
where = ["."]
namespaces = false